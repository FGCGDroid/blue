name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install git hook config
        run: git config core.hooksPath .githooks
      - name: Full test suite
        run: npm test
      - name: Build generated patch
        run: node scripts/build.mjs
      - name: Validate bundle
        run: node scripts/validate.mjs
      - name: Compliance selftest
        run: node scripts/check-compliance.mjs --selftest
      - name: Generated patch is committed
        run: git diff --exit-code -- cordis.patch.yml
