name: publish-beta

on:
  push:
    tags:
      - 'v3.0.0-beta.*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，例如 3.0.0-beta.20'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 解析版本
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "BLUE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "发布版本：$VERSION"

      - name: 构建 beta 包
        run: node scripts/build-v3-beta.mjs

      - name: 附到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
