name: Bug report
description: 报告可复现的问题（不要贴真实 token、Cookie 或客户数据）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认这是**已授权**的 CTF 靶场、演练或自有资产问题。
        不要在 issue 里贴真实 token、Cookie、Authorization、客户日志或可复现的真实主机地址。
        安全问题请走 SECURITY.md 的私密报告渠道。
  - type: input
    id: version
    attributes:
      label: 插件版本
      description: 运行 `npm view dsh-blue-team-mode version` 或看控制台版本
      placeholder: "1.3.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - Linux
        - macOS
        - 其他
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: 使用的预设
      options:
        - 蓝队防御模式（主会话）
        - 蓝队全工具执行角色
        - 某个专项 worker（monitor/intel/hunt/ir/forensics/hardening）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 用假数据描述；不要包含真实凭据
      placeholder: |
        1. 防御自检
        2. 创建测试目标
        3. 调用 blue_...
        4. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志/截图
      description: 请删除 token、Cookie、IP、客户名称和真实路径
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我只在已授权环境测试，且已移除真实凭据和敏感数据
          required: true
        - label: 我不是要求绕过高风险审批、路径闸或安全边界
          required: true
