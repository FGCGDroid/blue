name: Feature request
description: 提一个防守侧的需求或改进建议
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明使用场景，而不是只写“加一个自动封禁/自动攻击”。
        本项目不会加入：真实凭据收集、WebRTC/Canvas 指纹、心理恐吓、无限响应、绕过人工审批的 root 执行器。
  - type: input
    id: version
    attributes:
      label: 当前版本
      placeholder: "1.3.1"
  - type: textarea
    id: problem
    attributes:
      label: 你要解决什么问题
      description: 描述授权 CTF/演练/自有资产中的实际场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 尽量说明输入、输出、失败场景和安全边界
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这个需求只用于已授权环境
          required: true
        - label: 我理解高风险动作仍需要人工审批
          required: true
